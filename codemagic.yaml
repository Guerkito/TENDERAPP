workflows:
  ios-testflight:
    name: TenderApp iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: TENDERAPP
    integrations:
      app_store_connect: TenderApp ASC Key
    environment:
      groups:
        - app_store_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.guerkito.tenderapp"
    scripts:
      - name: Set up code signing
        script: |
          set -e
          echo "$CERT_KEY_B64" | openssl base64 -d -A > /tmp/cert_key.pem
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key=@file:/tmp/cert_key.pem
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-apk:
    name: TenderApp Android (APK)
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: TENDERAPP
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Compilar APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - mcmido.gamer@gmail.com
        notify:
          success: true
          failure: true
